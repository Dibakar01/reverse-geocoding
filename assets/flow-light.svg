<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="How places are clubbed: 124,057 by orbit, 465,069 by their district's largest city, and 32,002 with no parent city.">
  <rect width="1200" height="300" rx="18" fill="#fdf3f2"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="17.5" fill="none" stroke="#ece4e2"/>
  <text x="64" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#7a6a68" letter-spacing="2.5">HOW A PLACE FINDS ITS CITY</text>

  <rect x="64"  y="78" width="214.1" height="26" rx="6" fill="#d92819"/>
  <rect x="278.1"  y="78" width="802.7" height="26" rx="6" fill="#f0a79f"/>
  <rect x="1080.8"  y="78" width="55.2" height="26" rx="6" fill="#d8cfcd"/>

  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <g transform="translate(64 148)">
      <rect x="0" y="-24" width="10" height="10" rx="2" fill="#d92819"/>
      <text x="22" y="-15" font-size="19" font-weight="700" fill="#1a1211">Claimed by orbit</text>
      <text x="0" y="20" font-size="34" font-weight="700" fill="#d92819">124,057</text>
      <text x="0" y="50" font-size="15" fill="#7a6a68">a city in the same state whose</text>
      <text x="0" y="72" font-size="15" fill="#7a6a68">pull reaches it — 20.0%</text>
    </g>
    <g transform="translate(452 148)">
      <rect x="0" y="-24" width="10" height="10" rx="2" fill="#f0a79f"/>
      <text x="22" y="-15" font-size="19" font-weight="700" fill="#1a1211">Falls back to its district</text>
      <text x="0" y="20" font-size="34" font-weight="700" fill="#d92819">465,069</text>
      <text x="0" y="50" font-size="15" fill="#7a6a68">no orbit reaches it, so the largest</text>
      <text x="0" y="72" font-size="15" fill="#7a6a68">city in its own district — 74.9%</text>
    </g>
    <g transform="translate(860 148)">
      <rect x="0" y="-24" width="10" height="10" rx="2" fill="#d8cfcd"/>
      <text x="22" y="-15" font-size="19" font-weight="700" fill="#1a1211">No parent city</text>
      <text x="0" y="20" font-size="34" font-weight="700" fill="#7a6a68">32,002</text>
      <text x="0" y="50" font-size="15" fill="#7a6a68">remote districts with no town over</text>
      <text x="0" y="72" font-size="15" fill="#7a6a68">20,000 — city repeats locality, 5.2%</text>
    </g>
  </g>
</svg>