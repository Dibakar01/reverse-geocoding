<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img"
     aria-label="A latitude and longitude go in; the place is matched to its nearest locality and then clubbed to the city it belongs to. Koramangala resolves to Bengaluru.">
