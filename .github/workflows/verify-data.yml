name: verify-data

# Rebuilds the extract from GeoNames and checks it still reproduces.
# Monthly and on demand only — never per-push. Each run pulls ~21 MB from
# GeoNames, and hammering them on every commit would be rude.
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build-data
      - run: npm test
      - name: Report drift against the committed extract
        run: |
          if git diff --quiet -- data/; then
            echo "Extract reproduces byte-for-byte."
          else
            echo "::notice::GeoNames has changed since data/ was committed."
            git diff --stat -- data/
          fi
