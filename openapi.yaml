openapi: 3.1.0
info:
  title: Nishaan — reverse geocoding
  version: 1.0.0
  description: |
    Offline reverse geocoding. Give it a coordinate, get the locality, district
    and the city that place actually belongs to. No authentication, no keys, no
    rate limit — it answers from an in-process dataset and makes no outbound
    calls.
  license:
    name: MIT
    url: https://github.com/Dibakar01/reverse-geocoding/blob/main/LICENSE
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://your-host
    description: Your deployment
paths:
  /reverse:
    get:
      summary: Resolve a coordinate to a place
      operationId: reverse
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
          example: 22.58
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
          example: 88.42
      responses:
        '200':
          description: The place
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
              example:
                locality: Salt Lake City
                district: North 24 Parganas
                city: Kolkata
                state: West Bengal
                country: India
                displayName: Salt Lake City, Kolkata, West Bengal, India
        '400':
          description: Coordinate missing or out of range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /health:
    get:
      summary: Liveness and dataset size
      operationId: health
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  places: { type: integer, example: 621128 }
                  cached: { type: integer }
components:
  schemas:
    Place:
      type: object
      required: [locality, city, state, country, displayName]
      properties:
        locality:
          type: string
          description: Nearest named place. May be a neighbourhood.
        district:
          type: string
          description: Administrative district. Empty where the source has none.
        city:
          type: string
          description: |
            The city this place belongs to, precomputed. Equals `locality` for
            the ~5% of places with no parent city.
        state: { type: string }
        country: { type: string }
        displayName:
          type: string
          description: locality, city, state, country — deduplicated, comma joined.
    Error:
      type: object
      properties:
        error: { type: string }
